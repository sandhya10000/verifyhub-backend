name: Deploy VerifyHub Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifyhub-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout upstream master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Validate secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/verifyhub_deploy
          chmod 600 ~/.ssh/verifyhub_deploy

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify VPS connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/verifyhub_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "VPS SSH connection successful"'

      - name: Verify deployment target
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/verifyhub_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -eu
             test -d /var/www/api/.git
             test -f /var/www/api/.env
             test -f /var/www/api/Server.js
             test -d /var/www/api/uploads
             echo 'Production prerequisites verified.'
             echo 'Requested upstream commit: $TARGET_SHA'
             echo 'No application files changed; deployment is not enabled yet.'"