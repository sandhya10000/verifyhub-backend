name: Deploy VerifyHub Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifyhub-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout upstream master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/verifyhub_deploy
          chmod 600 ~/.ssh/verifyhub_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy upstream master
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/verifyhub_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /var/www/api

          # Ensure this is the expected upstream commit.
          git fetch upstream master
          test "$(git rev-parse upstream/master)" = "$TARGET_SHA"

          # Remove the unneeded local log changes.
          git restore --source=HEAD --staged --worktree -- analysis_logs.txt

          # Deploy the exact upstream commit.
          git reset --hard "$TARGET_SHA"

          # Keep production configuration and uploads present.
          test -f .env
          test -d uploads
          test -f Server.js

          # Install dependencies from the committed lockfile.
          npm ci --omit=dev

          # Restart production only.
          pm2 restart verifyhub-api

          # Check the public API.
          for attempt in $(seq 1 12); do
            if curl -fsS https://docs.verifyhub.in/; then
              echo
              echo "Production health check passed."
              exit 0
            fi
            sleep 5
          done

          echo "Production health check failed."
          exit 1
          REMOTE